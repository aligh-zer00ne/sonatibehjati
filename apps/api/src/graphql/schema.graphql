type ProductImage {
  id: ID!
  url: String!
  alt: String!
}
type Category {
  id: ID!
  slug: String!
  title: String!
  image: String!
}
type ProductPromotion {
  title: String!
  percent: Int!
  amount: Int!
  originalPrice: Int!
  price: Int!
  startsAt: String!
  endsAt: String!
}
type Product {
  id: ID!
  slug: String!
  title: String!
  shortDescription: String!
  description: String!
  category: Category!
  price: Int!
  weight: String!
  discountPercent: Int
  discountTitle: String
  discountStartsAt: String
  discountEndsAt: String
  promotion: ProductPromotion
  images: [ProductImage!]!
  isActive: Boolean!
  badge: String
  createdAt: String!
  updatedAt: String!
}
type Query {
  adminMe: AdminIdentity
  adminProducts(input: AdminProductsInput!): AdminProductsPage!
  adminOrders(input: AdminOrdersInput!): AdminOrdersPage!
  adminOrder(id: ID!): AdminOrder!
  adminUser(id: ID!): AdminUser!
  adminUsers(input: AdminUsersInput!): AdminUsersPage!
  adminDashboard: AdminDashboard!
  adminReport(input: AdminReportInput!): AdminReport!
  myOrders(input: MyOrdersInput!): MyOrdersPage!
  myOrder(id: ID!): AccountOrder!
  reverseLocation(latitude: Float!, longitude: Float!): String
  myAddresses: [Address!]!
  checkoutQuote(input: CheckoutInput!): CheckoutQuote!
  orderReceipt(id: ID!): OrderReceipt!
  orderByRequestId(requestId: ID!): OrderReceipt
  me: AuthUser
  health: String!
  promotionalProducts: [Product!]!
  products(category: String, search: String): [Product!]!
  product(slug: String!): Product
  categories: [Category!]!
  catalog(input: CatalogInput!): CatalogPage!
  productsByIds(ids: [ID!]!): [Product!]!
}
enum ProductSort {
  FEATURED
  NEWEST
  PRICE_ASC
  PRICE_DESC
  NAME_ASC
}
input CatalogInput {
  search: String
  category: String
  excludeSlug: String
  minPrice: Int
  maxPrice: Int
  sort: ProductSort
  page: Int
  pageSize: Int
}
type CatalogPage {
  items: [Product!]!
  total: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
}

type AuthUser {
  id: ID!
  phone: String!
  firstName: String
  lastName: String
  email: String
}
type OtpChallenge {
  challengeId: ID!
  phone: String!
  expiresAt: String!
  resendAt: String!
}
type AuthSession {
  user: AuthUser!
  accessToken: String!
  accessExpiresAt: String!
}
input RequestOtpInput {
  phone: String!
}
input VerifyOtpInput {
  challengeId: ID!
  phone: String!
  code: String!
}
type Mutation {
  setAdminPromotion(
    input: AdminPromotionInput!
    products: [AdminPromotionTargetInput!]!
  ): [Product!]!
  adminLogin(input: AdminLoginInput!): AdminSessionPayload!
  adminRefresh: AdminSessionPayload!
  adminLogout: Boolean!
  changeAdminPassword(input: AdminPasswordChangeInput!): Boolean!
  saveAdminShippingLabel(
    orderId: ID!
    input: AdminShippingLabelInput!
    expectedUpdatedAt: String
  ): AdminShippingLabel!
  saveAdminProduct(id: ID, expectedUpdatedAt: String, input: AdminProductInput!): Product!
  setAdminProductActive(id: ID!, isActive: Boolean!, expectedUpdatedAt: String!): Product!
  deleteAdminProduct(id: ID!, expectedUpdatedAt: String!): AdminProductDeletion!
  updateAdminOrderStatus(input: AdminOrderStatusInput!): AdminOrder!
  updateProfile(input: ProfileInput!): AuthUser!
  saveAddress(id: ID, input: AddressInput!): Address!
  deleteAddress(id: ID!): Boolean!
  createOrder(input: CreateOrderInput!): OrderReceipt!
  requestOtp(input: RequestOtpInput!): OtpChallenge!
  verifyOtp(input: VerifyOtpInput!): AuthSession!
  refreshToken: AuthSession!
  logout: Boolean!
}

