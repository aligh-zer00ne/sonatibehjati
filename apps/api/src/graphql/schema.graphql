type ProductImage {
  id: ID!
  url: String!
  alt: String!
}
type Category {
  id: ID!
  slug: String!
  title: String!
  image: String!
}
type Product {
  id: ID!
  slug: String!
  title: String!
  shortDescription: String!
  description: String!
  category: Category!
  price: Int!
  weight: String!
  images: [ProductImage!]!
  isActive: Boolean!
  badge: String
  createdAt: String!
  updatedAt: String!
}
type Query {
  me: AuthUser
  health: String!
  products(category: String, search: String): [Product!]!
  product(slug: String!): Product
  categories: [Category!]!
  catalog(input: CatalogInput!): CatalogPage!
  productsByIds(ids: [ID!]!): [Product!]!
}
enum ProductSort {
  FEATURED
  NEWEST
  PRICE_ASC
  PRICE_DESC
  NAME_ASC
}
input CatalogInput {
  search: String
  category: String
  excludeSlug: String
  minPrice: Int
  maxPrice: Int
  sort: ProductSort
  page: Int
  pageSize: Int
}
type CatalogPage {
  items: [Product!]!
  total: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
}

type AuthUser {
  id: ID!
  phone: String!
  firstName: String
  lastName: String
  email: String
}
type OtpChallenge {
  challengeId: ID!
  phone: String!
  expiresAt: String!
  resendAt: String!
}
type AuthSession {
  user: AuthUser!
  accessExpiresAt: String!
}
input RequestOtpInput {
  phone: String!
}
input VerifyOtpInput {
  challengeId: ID!
  phone: String!
  code: String!
}
type Mutation {
  requestOtp(input: RequestOtpInput!): OtpChallenge!
  verifyOtp(input: VerifyOtpInput!): AuthSession!
  refreshToken: AuthSession!
  logout: Boolean!
}
