input AdminPaymentRequestInput {
  requestId: ID!
  scope: PaymentRequestScope!
  customerId: ID
  amount: Int!
  title: String!
  payerName: String
  payerPhone: String
  expiresInHours: Int
}
input AdminPaymentRequestsInput {
  customerId: ID
  scope: PaymentRequestScope
  status: PaymentRequestStatus
  page: Int
}
type AdminPaymentRequest {
  id: ID!
  scope: PaymentRequestScope!
  customerId: ID
  customerName: String
  title: String!
  amount: Int!
  payerName: String
  payerPhone: String
  url: String!
  status: PaymentRequestStatus!
  createdAt: String!
  expiresAt: String!
  paidAt: String
  payments: [PaymentInfo!]!
}
type AdminPaymentRequestPage {
  items: [AdminPaymentRequest!]!
  total: Int!
  page: Int!
  gatewayAvailable: Boolean!
}
extend type Query {
  adminPaymentRequests(input: AdminPaymentRequestsInput!): AdminPaymentRequestPage!
}
extend type Mutation {
  createAdminPaymentRequest(input: AdminPaymentRequestInput!): AdminPaymentRequest!
  cancelAdminPaymentRequest(id: ID!): AdminPaymentRequest!
}

input ShippingRuleInput {
  method: ShippingMethod!
  enabled: Boolean!
  baseCost: Int!
  additionalKgCost: Int!
  freeShippingEligible: Boolean!
}
input ShippingSettingsInput {
  freeShippingThreshold: Int
  methods: [ShippingRuleInput!]!
}
type ShippingRule {
  method: ShippingMethod!
  enabled: Boolean!
  baseCost: Int!
  additionalKgCost: Int!
  freeShippingEligible: Boolean!
}
type ShippingSettings {
  freeShippingThreshold: Int
  methods: [ShippingRule!]!
  updatedAt: String!
}
type ShippingOptions {
  availableMethods: [ShippingMethod!]!
}
extend type Query {
  adminShippingSettings: ShippingSettings!
  shippingOptions: ShippingOptions!
}
extend type Mutation {
  saveAdminShippingSettings(
    input: ShippingSettingsInput!
    expectedUpdatedAt: String!
  ): ShippingSettings!
}

input AdminPriceChangeInput {
  id: ID!
  price: Int!
  expectedUpdatedAt: String!
}
type AdminPriceItem {
  id: ID!
  title: String!
  weight: String!
  price: Int!
  isActive: Boolean!
  updatedAt: String!
  categoryTitle: String!
  imageUrl: String
}

input StoreInformationInput {
  name: String!
  phone: String!
  address: String!
  postalCode: String!
}
type StoreInformation {
  name: String!
  phone: String!
  address: String!
  postalCode: String!
  isConfigured: Boolean!
  updatedAt: String
}
extend type Query {
  adminStoreInformation: StoreInformation!
}
extend type Mutation {
  saveAdminStoreInformation(
    input: StoreInformationInput!
    expectedUpdatedAt: String
  ): StoreInformation!
}

type AdminOrderProvince {
  code: String!
  name: String!
  count: Int!
  locatedCount: Int!
  latitude: Float
  longitude: Float
}
type AdminOrdersMapResult {
  total: Int!
  locatedCount: Int!
  unknownCount: Int!
  provinces: [AdminOrderProvince!]!
  items: [AdminOrderSummary!]!
  page: Int!
  pageSize: Int!
  pageTotal: Int!
  totalPages: Int!
}
extend type Query {
  adminOrdersMap(input: AdminOrdersInput!, province: String): AdminOrdersMapResult!
}

enum MessageKind {
  PAYMENT
  SHIPPING
}
input MessageTemplateInput {
  id: ID!
  kind: MessageKind!
  title: String!
  body: String!
}
type MessageTemplate {
  id: ID!
  kind: MessageKind!
  title: String!
  body: String!
}
type MessageTemplateSettings {
  items: [MessageTemplate!]!
  updatedAt: String
  storeName: String!
}
input AdminShipmentInput {
  orderId: ID!
  shippingMethod: ShippingMethod!
  trackingNumber: String!
  expectedUpdatedAt: String!
  expectedLabelUpdatedAt: String
}
extend type Query {
  adminMessageTemplates: MessageTemplateSettings!
}
extend type Mutation {
  saveAdminMessageTemplates(
    items: [MessageTemplateInput!]!
    expectedUpdatedAt: String
  ): MessageTemplateSettings!
  saveAdminShipment(input: AdminShipmentInput!): AdminOrder!
}
