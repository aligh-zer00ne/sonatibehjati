type ProductImage {
  id: ID!
  url: String!
  alt: String!
}
type Category {
  id: ID!
  slug: String!
  title: String!
  image: String!
}
type Product {
  id: ID!
  slug: String!
  title: String!
  shortDescription: String!
  description: String!
  category: Category!
  price: Int!
  weight: String!
  images: [ProductImage!]!
  isActive: Boolean!
  badge: String
  createdAt: String!
  updatedAt: String!
}
type Query {
  reverseLocation(latitude: Float!, longitude: Float!): String
  myAddresses: [Address!]!
  checkoutQuote(input: CheckoutInput!): CheckoutQuote!
  orderReceipt(id: ID!): OrderReceipt!
  orderByRequestId(requestId: ID!): OrderReceipt
  me: AuthUser
  health: String!
  products(category: String, search: String): [Product!]!
  product(slug: String!): Product
  categories: [Category!]!
  catalog(input: CatalogInput!): CatalogPage!
  productsByIds(ids: [ID!]!): [Product!]!
}
enum ProductSort {
  FEATURED
  NEWEST
  PRICE_ASC
  PRICE_DESC
  NAME_ASC
}
input CatalogInput {
  search: String
  category: String
  excludeSlug: String
  minPrice: Int
  maxPrice: Int
  sort: ProductSort
  page: Int
  pageSize: Int
}
type CatalogPage {
  items: [Product!]!
  total: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
}

type AuthUser {
  id: ID!
  phone: String!
  firstName: String
  lastName: String
  email: String
}
type OtpChallenge {
  challengeId: ID!
  phone: String!
  expiresAt: String!
  resendAt: String!
}
type AuthSession {
  user: AuthUser!
  accessToken: String!
  accessExpiresAt: String!
}
input RequestOtpInput {
  phone: String!
}
input VerifyOtpInput {
  challengeId: ID!
  phone: String!
  code: String!
}
type Mutation {
  saveAddress(id: ID, input: AddressInput!): Address!
  deleteAddress(id: ID!): Boolean!
  createOrder(input: CreateOrderInput!): OrderReceipt!
  requestOtp(input: RequestOtpInput!): OtpChallenge!
  verifyOtp(input: VerifyOtpInput!): AuthSession!
  refreshToken: AuthSession!
  logout: Boolean!
}

type Address {
  id: ID!
  title: String!
  recipientName: String!
  recipientPhone: String!
  province: String!
  city: String!
  postalAddress: String!
  postalCode: String!
  latitude: Float
  longitude: Float
  isDefault: Boolean!
}
input AddressInput {
  title: String!
  recipientName: String!
  recipientPhone: String!
  province: String!
  city: String!
  postalAddress: String!
  postalCode: String!
  latitude: Float
  longitude: Float
  isDefault: Boolean!
}
input CheckoutLineInput {
  productId: ID!
  quantity: Int!
}
input CheckoutInput {
  addressId: ID!
  items: [CheckoutLineInput!]!
  discountCode: String!
}
input CreateOrderInput {
  addressId: ID!
  items: [CheckoutLineInput!]!
  discountCode: String!
  requestId: ID!
  expectedTotal: Int!
}
type CheckoutLine {
  productId: ID!
  title: String!
  weight: String!
  imageUrl: String
  quantity: Int!
  unitPrice: Int!
  lineTotal: Int!
}
type CheckoutQuote {
  addressId: ID!
  items: [CheckoutLine!]!
  subtotal: Int!
  discount: Int!
  shipping: Int!
  total: Int!
}
type OrderReceipt {
  id: ID!
  number: Int!
  status: String!
  subtotal: Int!
  discount: Int!
  shipping: Int!
  total: Int!
  createdAt: String!
}
