:root{--subc:#9fd0f5;--lnk:#e6cb8e;--g1:#040a1c;--g2:#09194a;--g3:#0e2868;--glow:#3a76cf;--so:1;--mo:1;--sn:0;--sb:#3a72c8;--sbo:.55;--sf:#14377f;--wo:1;--suc:#ffd98a;--sug:rgba(255,217,138,.45);--endc:#9fd0f5;}

:root[data-sky=dawn]{--subc:#e2f1ff;--lnk:#fff6d8;--g1:#1b2f6e;--g2:#5b5fa6;--g3:#f2b98c;--glow:#ffd9a8;--so:.35;--mo:0;--sn:.9;--sb:#7a6aa8;--sbo:.6;--sf:#3a3a7a;--wo:.7;--suc:#ffb878;--sug:rgba(255,160,100,.5);--endc:#fff}
:root[data-sky=sunset]{--subc:#e2f1ff;--lnk:#fff6d8;--g1:#14265f;--g2:#6a3f8f;--g3:#f08a5d;--glow:#ffc27a;--so:.3;--mo:0;--sn:.85;--sb:#8a4f9a;--sbo:.6;--sf:#3b2a6b;--wo:1;--suc:#ff9a5c;--sug:rgba(255,120,70,.5);--endc:#fff}
.stars{opacity:var(--so)}.mn{opacity:var(--mo)}
.sn{position:fixed;right:30px;top:calc(34px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#fffbe8 35%,var(--suc) 75%);box-shadow:0 0 26px 12px var(--sug);opacity:var(--sn);pointer-events:none;z-index:0}
.sb{fill:var(--sb);fill-opacity:var(--sbo)}.sf{fill:var(--sf);fill-opacity:.95}.wn{opacity:var(--wo)}

<script>
(function(){
  var cx=document.createElement("canvas").getContext("2d");
  function ink(el){
    var nodes=el.querySelectorAll(".b1,.b2"); if(!nodes.length) nodes=[el];
    var L=1e9,R=-1e9;
    Array.prototype.forEach.call(nodes,function(n){
      var cs=getComputedStyle(n),rg=document.createRange();rg.selectNodeContents(n);
      var r=rg.getBoundingClientRect();
      cx.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
      cx.direction="rtl";cx.textAlign="left";
      var m=cx.measureText(n.textContent.trim());
      L=Math.min(L,r.left-m.actualBoundingBoxLeft);
      R=Math.max(R,r.left+m.actualBoundingBoxRight);
    });
    return {l:L,r:R};
  }
  function center(el,z){
    el.style.transform="";
    var i=ink(el),pr=el.closest(".hero").getBoundingClientRect();
    var dx=(pr.left+pr.right)/2-(i.l+i.r)/2;
    el.style.transform="translateX("+(dx/z)+"px)";
  }
  function fit(){
    var wrap=document.querySelector(".wrap"),el=document.querySelector(".sub"),nm=document.querySelector(".name");
    if(!el||!wrap||!nm) return;
    wrap.style.zoom=1;el.style.transform="";nm.style.transform="";
    var max=el.closest(".hero").clientWidth*0.86;
    var size=Math.min(innerWidth>=900?110:96,innerHeight*0.115);
    el.style.fontSize=size+"px";
    var g=function(){var i=ink(el);return i.r-i.l};
    while(size>20&&g()>max){size-=1;el.style.fontSize=size+"px"}
    var h=wrap.scrollHeight,z=1;
    if(h>innerHeight+1){z=Math.max(.65,innerHeight/h);wrap.style.zoom=z}
    center(el,z);center(nm,z);
  }
  fit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener("load",fit);addEventListener("resize",fit);
})();
</script>
