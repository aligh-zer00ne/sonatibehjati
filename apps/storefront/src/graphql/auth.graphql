fragment SessionUser on AuthUser {
  id
  phone
  firstName
  lastName
  email
}
query CurrentUser {
  me {
    ...SessionUser
  }
}
mutation RequestOtp($input: RequestOtpInput!) {
  requestOtp(input: $input) {
    challengeId
    phone
    expiresAt
    resendAt
  }
}
mutation VerifyOtp($input: VerifyOtpInput!) {
  verifyOtp(input: $input) {
    accessToken
    user {
      ...SessionUser
    }
    accessExpiresAt
  }
}
mutation RefreshUserSession {
  refreshToken {
    accessToken
    user {
      ...SessionUser
    }
    accessExpiresAt
  }
}
mutation LogoutUser {
  logout
}
