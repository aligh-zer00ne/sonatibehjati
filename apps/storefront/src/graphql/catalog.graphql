fragment CatalogProduct on Product {
  id
  slug
  title
  shortDescription
  description
  price
  promotion {
    title
    percent
    amount
    originalPrice
    price
    startsAt
    endsAt
  }
  weight
  badge
  isActive
  images {
    id
    url
    alt
  }
  category {
    id
    slug
    title
    image
  }
  createdAt
  updatedAt
}
query CatalogPage($input: CatalogInput!) {
  categories {
    id
    slug
    title
    image
  }
  catalog(input: $input) {
    items {
      ...CatalogProduct
    }
    total
    page
    pageSize
    totalPages
  }
}
query ProductDetail($slug: String!) {
  product(slug: $slug) {
    ...CatalogProduct
  }
}
query SelectedProducts($ids: [ID!]!) {
  productsByIds(ids: $ids) {
    ...CatalogProduct
  }
}

fragment HomepageContentFields on HomepageContent {
  updatedAt
  slides {
    src
    mobileSrc
    alt
    label
    eyebrow
    title
    subtitle
    description
    href
    action
    mobileAction
  }
  story {
    src
    mobileSrc
    alt
    title
    subtitle
    description
    action
    mobileAction
    href
    location
  }
}
query HomepageContent {
  homepageContent {
    ...HomepageContentFields
  }
}
