query HomepageCatalog {
  categories {
    id
    slug
    title
    image
  }
  products {
    id
    slug
    title
    shortDescription
    description
    price
    weight
    badge
    isActive
    images {
      id
      url
      alt
    }
    category {
      id
      slug
      title
      image
    }
    createdAt
    updatedAt
  }
}
