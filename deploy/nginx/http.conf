# Initial HTTP-only configuration, used to obtain the certificate without editing other sites.
server {
    listen 80;
    server_name sonatibehjati.ir admin.sonatibehjati.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sonatibehjati-acme;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
