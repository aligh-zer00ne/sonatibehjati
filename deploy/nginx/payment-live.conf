# Main storefront with SEP payments: real SMS or explicitly enabled temporary fixed-code login.
# Install only after configuring the production API; callbacks under /payment/ are public.
# Requires the existing certificate. No preview password or gate cookie is used.
server {
    listen 80;
    server_name sonatibehjati.ir admin.sonatibehjati.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sonatibehjati-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sonatibehjati.ir;
    ssl_certificate /etc/letsencrypt/live/sonatibehjati-ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonatibehjati-ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    client_max_body_size 1m;
    location ^~ /uploads/products/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
    location = /admin { return 302 https://admin.sonatibehjati.ir/admin; }
    location ^~ /admin/ { return 302 https://admin.sonatibehjati.ir$request_uri; }
    location = /api/auth {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location = /api/catalog/reviews {
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location = /api/catalog/selection {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    server_name admin.sonatibehjati.ir;
    ssl_certificate /etc/letsencrypt/live/sonatibehjati-ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonatibehjati-ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    root /var/www/sonatibehjati/apps/admin/dist;
    index index.html;
    client_max_body_size 1m;
    location ^~ /uploads/products/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
    location = /api/admin/uploads {
        client_max_body_size 8m;
        if ($request_method != POST) { return 405; }
        if ($http_origin != "https://admin.sonatibehjati.ir") { return 403; }
        proxy_pass http://127.0.0.1:4100/admin/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location = /api/admin {
        # Keep user OTP operations inaccessible through the shared GraphQL endpoint:
        # their API resolvers require the storefront Origin, which is rejected here.
        if ($request_method != POST) { return 405; }
        if ($http_origin != "https://admin.sonatibehjati.ir") { return 403; }
        proxy_pass http://127.0.0.1:4100/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The unchanged Express app has not enabled trust proxy.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cookie_flags behjati_admin_refresh secure;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ { return 404; }
    location ^~ /images/ {
        alias /var/www/sonatibehjati/apps/storefront/public/images/;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
