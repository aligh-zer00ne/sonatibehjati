# Public storefront for gateway review while the API still uses a fixed development OTP.
# User authentication is temporarily unavailable. The admin keeps its preview protection.
# Requires the existing certificate and private admin preview-access snippets.
server {
    listen 80;
    server_name sonatibehjati.ir admin.sonatibehjati.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sonatibehjati-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sonatibehjati.ir;
    ssl_certificate /etc/letsencrypt/live/sonatibehjati-ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonatibehjati-ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    client_max_body_size 1m;
    location = /admin { return 302 https://admin.sonatibehjati.ir/admin; }
    location ^~ /admin/ { return 302 https://admin.sonatibehjati.ir$request_uri; }
    location = /api/auth {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"errors":[{"message":"ورود و ثبت سفارش تا فعال‌سازی پیامک واقعی موقتاً در دسترس نیست.","extensions":{"code":"SERVICE_UNAVAILABLE"}}]}';
    }
    location = /api/catalog/selection {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    server_name admin.sonatibehjati.ir;
    ssl_certificate /etc/letsencrypt/live/sonatibehjati-ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonatibehjati-ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/sonatibehjati-preview-server.conf;
    root /var/www/sonatibehjati/apps/admin/dist;
    index index.html;
    client_max_body_size 1m;
    location = /api/admin {
        include /etc/nginx/sonatibehjati-preview-api.conf;
        proxy_pass http://127.0.0.1:4100/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The unchanged Express app has not enabled trust proxy.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Auth-Proxy-Key "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ { return 404; }
    location ^~ /images/ {
        alias /var/www/sonatibehjati/apps/storefront/public/images/;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location / {
        include /etc/nginx/sonatibehjati-preview-cookie.conf;
        try_files $uri $uri/ /index.html;
    }
}
