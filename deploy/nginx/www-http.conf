# Bootstrap www before issuing its separate certificate; install as
# /etc/nginx/sites-available/sonatibehjati-www.conf, NOT alongside www.conf.
server {
    listen 80;
    server_name www.sonatibehjati.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sonatibehjati-acme;
        try_files $uri =404;
    }
    location / { return 308 https://sonatibehjati.ir$request_uri; }
}
