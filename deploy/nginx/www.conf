# Replace the www-http.conf bootstrap in the SAME installed file after Certbot
# succeeds. Keep the main storefront, admin and other sites' configurations intact.
server {
    listen 80;
    server_name www.sonatibehjati.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sonatibehjati-acme;
        try_files $uri =404;
    }
    location / { return 308 https://sonatibehjati.ir$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.sonatibehjati.ir;
    ssl_certificate /etc/letsencrypt/live/sonatibehjati-www/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonatibehjati-www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://sonatibehjati.ir$request_uri;
}
